# Atreyu — an Omarchy theme cut from the Atreyu launch film.
# Palette extracted with Aether from the "mythic valley" background (a river of
# amber light through dark, misted mountains), then tuned by hand: the amber
# river is the accent; the mist's warm cream is the text; everything else is the
# valley's steel blue and near-black navy.
mode = "dark"

accent = "#ef9240"
selection = "#1f3a4c"
muted = "#5a6a78"

background = "#0a1a26"
dark_background = "#06111a"
darker_background = "#030a10"
lighter_background = "#16303f"

foreground = "#e9e2d5"
dark_foreground = "#b9ad98"
light_foreground = "#f2e8d6"
bright_foreground = "#fbecd1"

